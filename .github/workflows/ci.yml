name: BuyItNow CI

on:
  push:
    branches: [ main, master ]

jobs:
  ecommerce:
    name: Ecommerce — Build, Vet and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      
      - name: Download dependencies
        run: go mod download

      - name: Verify module integrity
        run: go mod verify
      
      - name: run tests
        run: go test -v -race -cover ./...

      - name: Build 
        run: go build ./...
  
  #Job 2 Notification servicee
  notification:
    name: Notification -- Build and Vet
    runs-on: ubuntu-latest
    defaults: 
      run: 
        working-directory: ./notification-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
         go-version: "1.26"
         cache: true
      - name: download dependencies
        run: go mod download

      - name: Verify module
        run: go mod verify
      
      - name: Run tests
        run: go test -v -race -cover ./...
      
      - name: Build
        run: go build ./...

      - name: Vet 
        run: go vet ./...
  
  docker:
    name: Build and  Push Docker Images
    needs: [ecommerce, notification]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD}}
      - name: set Docker builx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and Push BuyItNow Images
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME}}/buyitnow:latest

      - name:  Build and Push Notification
        uses: docker/build-push-action@v6
        with:
          context: ./notification-service
          dockerfile: notification-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME}}/buyitnow-notification:latest


      

  



  

      

 